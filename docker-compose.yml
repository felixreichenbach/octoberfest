services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oktoberfest
      POSTGRES_PASSWORD: oktoberfest
      POSTGRES_DB: oktoberfest
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oktoberfest"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://oktoberfest:oktoberfest@db:5432/oktoberfest
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

  # Private Grafana Synthetic Monitoring probe. Opt-in only (see README) — needs
  # a real probe token from `gcx synthetic-monitoring probes create` to do anything.
  sm-probe:
    image: grafana/synthetic-monitoring-agent:latest
    profiles:
      - monitoring
    command:
      - --api-server-address=${SM_API_SERVER_ADDRESS}
    environment:
      SM_AGENT_API_TOKEN: ${SM_AGENT_API_TOKEN}
    restart: unless-stopped

volumes:
  db_data:
