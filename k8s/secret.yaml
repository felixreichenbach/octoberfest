# Demo credentials only, matching docker-compose.yml — replace before any real deployment.
apiVersion: v1
kind: Secret
metadata:
  name: oktoberfest-secrets
type: Opaque
stringData:
  POSTGRES_USER: oktoberfest
  POSTGRES_PASSWORD: oktoberfest
  POSTGRES_DB: oktoberfest
  DATABASE_URL: postgresql://oktoberfest:oktoberfest@db:5432/oktoberfest
  SESSION_SECRET: change-me-in-production
