apiVersion: apps/v1
kind: Deployment
metadata:
  name: sm-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sm-probe
  template:
    metadata:
      labels:
        app: sm-probe
    spec:
      automountServiceAccountToken: false
      containers:
        - name: sm-agent
          image: "grafana/synthetic-monitoring-agent:latest"
          args:
            - --api-server-address=$(API_SERVER_ADDRESS)
            # Scripted/browser checks refuse targets in this CIDR by default (SSRF guard).
            # minikube's service network is private (10.0.0.0/8 by default), so a check
            # against an in-cluster Service would otherwise fail with "IP is in a
            # blacklisted range" — clear the blocklist since this probe only ever
            # targets its own cluster.
            - --blocked-nets=
          env:
            - name: API_SERVER_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: oktoberfest-sm-probe
                  key: api-server-address
            - name: SM_AGENT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: oktoberfest-sm-probe
                  key: api-token
